<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Informatika</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,container-queries"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.js"></script>

<body>
  <div class="bg-zinc-50 w-full min-h-screen" x-data="app">
    <div class="bg-white mx-auto max-w-screen-xl min-h-screen border-x-zinc-100 border-x py-8">
      <div class="flex">
        <div class="flex justify-around shadow-md mx-auto rounded-full px-4 border border-zinc-100">
          <div class="text-gray-600 hover:text-teal-400 cursor-pointer px-4 py-2" @click="visit('/')">
            Kezdőlap
          </div>

          <div class="text-gray-600 hover:text-teal-400 cursor-pointer px-4 py-2" @click="visit('/team')">
            Csapat
          </div>

          <div class="text-gray-600 hover:text-teal-400 cursor-pointer px-4 py-2" @click="visit('/blog')">
            Blog
          </div>

          <div class="text-gray-600 hover:text-teal-400 cursor-pointer px-4 py-2" @click="visit('/uzenetek')">
            Üzenet küldés
          </div>

          <div class="text-gray-600 hover:text-teal-400 cursor-pointer px-4 py-2" @click="visit('/lista')"
            x-show="!adminLoggedIn">
            Árlista
          </div>

          <div class="text-gray-600 hover:text-teal-400 cursor-pointer px-4 py-2" @click="visit('/login')"
            x-show="!adminLoggedIn">
            Belépés
          </div>


          <div class="text-gray-600 hover:text-teal-400 cursor-pointer px-4 py-2" @click="visit('/admin')"
            x-show="adminLoggedIn">
            Admin
          </div>

          <div class="text-gray-600 hover:text-teal-400 cursor-pointer px-4 py-2" @click="logout"
            x-show="adminLoggedIn">
            Kilépés
          </div>
        </div>

      <template x-if="isActivePage('/login')">
        <div class="mt-12 px-24">
          <div class="flex flex-col justify-center px-6 py-12 lg:px-8">
            <div class="sm:mx-auto sm:w-full sm:max-w-sm">
              <h2 class="mt-10 text-center text-2xl font-bold leading-9 tracking-tight text-gray-900">
                Belépés
              </h2>
              <div class="text-gray-400 text-sm text-center w-full">
                (admin@example.com / 123456)
              </div>
            </div>

            <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
              <div class="space-y-6" action="#" method="POST">
                <div>
                  <label for="email" class="block text-sm font-medium leading-6 text-gray-900">Email</label>
                  <div class="mt-2">
                    <input x-model="loginEmail" id="email" name="email" type="email" autocomplete="email" required
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" />
                  </div>
                </div>

                <div>
                  <div class="flex items-center justify-between">
                    <label for="password" class="block text-sm font-medium leading-6 text-gray-900">Jelszó</label>
                  </div>
                  <div class="mt-2">
                    <input x-model="loginPassword" id="password" name="password" type="password"
                      autocomplete="current-password" required
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" />
                  </div>
                </div>

                <div>
                  <div x-show="loginError != ''" x-text="loginError"
                    class="border-red-500 border rounded p-2 my-2 text-red-800"></div>
                  <button @click="login"
                    class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                    Belépés
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template x-if="isActivePage('/blog')">
        <div class="mt-12 px-24">
          <div class="mx-auto max-w-3xl text-base leading-7 text-gray-700">
            <h1 class="mt-2 text-3xl font-bold tracking-tight text-gray-900 sm:text-4xl">
              Azonnali határidővel, igényeidnek megfelelően összeállított projektfeladat elkészítése
            </h1>
            <p class="mt-6 text-xl leading-8">
              Csapattagjaink valós életből vett gyakorló projekteken tanulnak meg csapatban hatékonyan együtt dolgozni.
              A legtöbb esetben a csapattagok nem megválaszthatóak, ami már egy kezdő stresszes löketet ad a feladatnak,
              extra komplikációként pedig egy olyan téma is bejöhet, amit esetleg nem a csoport szeretett volna
              megkapni. Ám ezeken hamar túl kell lendülni a sikeres feladatvégzés érdekében! A projekt végrehajtása egy
              sajátos tanulási technikát fejleszt, amely során a megismerés fő forrásává az önálló és a csoportos
              tapasztalás válik. Fontos teendő a projekt elkezdése és a kutatómunka megkezdése előtt, a csapattagok
              feladatainak igazságos elosztása. Valakinek (lehetőleg egy embernek) fel kell vennie a vezető szerepét, és
              határozott döntéseket hoznia, különben megvan annak az esélye, hogy nem fog hatékonyan elkészülni időre a
              projektfeladat. De mi egy teljes csapatot alkotunk!
            </p>
            <div class="mt-10 max-w-2xl">
              <div class="text-xl text-gray-900"> A projektmunka céljai:</div>
              <p>


                <br />• háttérismeret rendszerezése (szakirodalom gyűjtés és összevetés)
                <br />• leírás (a feladat, esetleg valamilyen folyamat pontos dokumentálása)
                <br />• funkciókeresés (egy folyamat/jelenség funkciójának vizsgálata)
                <br />• oknyomozás (folyamatot/jelenséget kiváltó okok feltárása)

                <br /><br />
              <div class="text-xl text-gray-900">A projektmunka jellemzői:</div>
              <br />• problémafelvetés – mire vagyunk kíváncsiak
              <br />• vizsgálati módszer – milyen eszközökkel kutatunk
              <br />• adatrögzítés – például grafikonon, táblázatban, térképen
              <br />• következtetés – magyarázat, beleértve esetleges kudarcot is
              <br />• helyesírás!
              <br />• koherencia – a gondolatmenet egységes-e, következetesség

              <br /><br />Amint az látható, számos buktatója van a projektmunkának, főleg egyetemen/főiskolán, hiszen a
              kapott téma, és az elvárás is magasabb, mint azt középiskolában megszokhattad. Azonban ezeknek a típusú
              feladatoknak megvannak a maga előnyei is. Az iskolapadból kikerülve a legtöbb munkahelyen is bevett szokás
              csapatban dolgozni. Az ilyen egyetemi feladatok pedig hozzászoktatnak és rutinossá tesznek, hogy
              kikerülvén a nagyvilágba, már megálld a helyed. Gondolj tehát az projektmunkára úgy, mint egy szükséges
              gyakorlatra, állj hozzá mindig pozitívan és próbáld meg kihozni belőle a legtöbbet!

              </p>
              <br /><br />
              <div class="text-2xl text-gray-900">Mikor van erre szükséged?</div>
              <ul role="list" class="mt-8 max-w-xl space-y-8 text-gray-600">
                <li class="flex gap-x-3">
                  <svg class="mt-1 h-5 w-5 flex-none text-indigo-600" viewBox="0 0 20 20" fill="currentColor"
                    aria-hidden="true">
                    <path fill-rule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z"
                      clip-rule="evenodd" />
                  </svg>
                  <span><strong class="font-semibold text-gray-900">Amikor az új projektedhez nincs elég erőforrásod
                    </strong>
                  </span>
                </li>
                <li class="flex gap-x-3">
                  <svg class="mt-1 h-5 w-5 flex-none text-indigo-600" viewBox="0 0 20 20" fill="currentColor"
                    aria-hidden="true">
                    <path fill-rule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z"
                      clip-rule="evenodd" />
                  </svg>
                  <span><strong class="font-semibold text-gray-900">Amikor jól felkészült juniorokra és tapasztalt
                      szeniorokra egyaránt szükséged van egy nagyobb feladathoz.</strong>
                  </span>
                </li>
                <li class="flex gap-x-3">
                  <svg class="mt-1 h-5 w-5 flex-none text-indigo-600" viewBox="0 0 20 20" fill="currentColor"
                    aria-hidden="true">
                    <path fill-rule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z"
                      clip-rule="evenodd" />
                  </svg>
                  <span><strong class="font-semibold text-gray-900">Amikor projekt elkészítési folyamatban menedzserre,
                      tesztelőkre és rendszergazdára is szükséged van.</strong>
                  </span>
                </li>
              </ul>
              <p class="mt-8">
                Végül megbeszéljük a határidőt és átadjuk Neked a kész projektmunkát!
              </p>
            </div>

            <div class="mt-8">
              <h1 class="mt-2 text-4xl font-bold tracking-tight text-gray-900 sm:text-4xl">
                Bemutató
              </h1>
              <div class="w-full mt-2">
                <iframe
                  src="https://docs.google.com/presentation/d/e/2PACX-1vTIoyX6sz0K5NHJx1Iai4H2ibXXuSsjp9N6wWX4uF0z8lYddyhllOtNxIV3oVptaxKcEIiOXjAC3u3b/embed?start=false&loop=false&delayms=3000"
                  frameborder="0" width="480" height="299" allowfullscreen="true" mozallowfullscreen="true"
                  webkitallowfullscreen="true"></iframe>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template x-if="isActivePage('/uzenetek')">
        <div class="mt-12 px-24">
          <div class="space-y-12">
            <div class="border-b border-gray-900/10 pb-12">
              <h2 class="text-base font-semibold leading-7 text-gray-900">
                Üzenet küldés
              </h2>
              <p class="mt-1 text-sm leading-6 text-gray-600">
                Az üzenetek csak memóriában tárolódnak.
              </p>

              <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
                <div class="col-span-full">
                  <label for="name" class="block text-sm font-medium leading-6 text-gray-900">Név</label>
                  <div class="mt-2">
                    <input type="text" x-model="formName" autocomplete="name"
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                      placeholder="John Doe" />
                  </div>
                </div>

                <div class="col-span-full">
                  <label for="message" class="block text-sm font-medium leading-6 text-gray-900">Üzenet</label>
                  <div class="mt-2">
                    <textarea x-model="formMessage" id="message" name="message" rows="3"
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="mt-6 flex items-center justify-end gap-x-6">
            <div x-text="formResultMessage"></div>
            <button type="submit" @click="sendMessage"
              class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
              Üzenet küldés
            </button>
          </div>
        </div>
      </template>

          <ul>

                      <path strokeLinecap="round" strokeLinejoin="round"

                    </svg>
                  </div>
                  <div class="flex-auto">

                    </div>
                    <p class="mt-1 line-clamp-2 text-sm leading-6 text-gray-600" x-text="item.message"></p>
                  </div>
                </div>
              </li>
            </template>

          </ul>
        </div>
      </template>

                  <li>

                    <h3 class="mt-6 text-lg font-semibold leading-8 tracking-tight text-gray-900">

                    <h3 class="mt-6 text-lg font-semibold leading-8 tracking-tight text-gray-900">

      <template x-if="isActivePage('/lista')">
        <div class="mt-12 px-24">
          <div class="border-b border-gray-900/10 pb-12">
            <div class="bg-white py-24 sm:py-32">
              <div class="mx-auto max-w-7xl px-6 lg:px-8">
                <div class="mx-auto max-w-2xl lg:mx-0">
                  <h2 class="text-3xl font-bold tracking-tight text-gray-900 sm:text-4xl">

                </div>
                <ul role="list"

                  <li>
                    <h3 class="mt-6 text-lg font-semibold leading-8 tracking-tight text-gray-900">

                    <h3 class="mt-6 text-lg font-semibold leading-8 tracking-tight text-gray-900">
